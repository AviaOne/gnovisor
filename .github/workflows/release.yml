name: release

# Fires on a version tag only: one tar.gz per architecture holding a single
# gnovisor binary, plus SHA256SUMS over the two archives. A manual run is
# possible, but the job is skipped unless it was started from a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    # Started from a branch, this job would name the release after the branch
    # and announce that name as the version. Tags only.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build and package
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            rm -rf build
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-X github.com/AviaOne/gnovisor/internal/version.Version=${VERSION}" \
              -o ./build/gnovisor ./cmd/gnovisor
            chmod 0755 ./build/gnovisor
            tar -czf "dist/gnovisor-${GITHUB_REF_NAME}-linux-${arch}.tar.gz" -C build gnovisor
          done
          cd dist && sha256sum gnovisor-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          set -eu
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "NOTES=--notes-file $notes" >> "$GITHUB_ENV"
          else
            echo "NOTES=--generate-notes" >> "$GITHUB_ENV"
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" \
            --title "GnoVisor $GITHUB_REF_NAME" \
            $NOTES \
            dist/gnovisor-*.tar.gz dist/SHA256SUMS
